name: SURAYA AI validation

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: suraya-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend core
      - name: Run tests
        run: pytest -q
      - name: Build deployment image
        run: docker build -t suraya-ai:ci .
