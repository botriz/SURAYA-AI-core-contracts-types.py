[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suraya-ai"
version = "0.4.0"
description = "Private Personal AI Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = [
    "core",
    "core.agents",
    "core.analytics",
    "core.audit",
    "core.brain",
    "core.cloud",
    "core.code",
    "core.contracts",
    "core.events",
    "core.executor",
    "core.finance",
    "core.guardian",
    "core.knowledge",
    "core.media",
    "core.memory",
    "core.models",
    "core.projects",
    "core.research",
    "core.runtime",
    "core.security",
    "core.social",
    "core.system",
    "core.tools",
    "core.wealth",
    "backend",
    "backend.app",
]
